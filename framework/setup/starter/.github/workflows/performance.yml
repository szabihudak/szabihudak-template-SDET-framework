name: Performance Tests

# Generated by npm run setup. Manually triggered because performance runs load
# a shared environment. The target must set allow.performance in
# config/environments/environments.json.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "TEST_ENV to measure (must allow performance)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TEST_ENV: ${{ inputs.environment }}
  K6_IMAGE: grafana/k6:1.8.1

jobs:
  api-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target environment
        run: |
          TARGET_BASE_URL=$(node -e "
            const environments = require('./config/environments/environments.json');
            const config = environments[process.env.TEST_ENV];

            if (!config) {
              throw new Error('Unknown TEST_ENV: ' + process.env.TEST_ENV);
            }

            if (!config.allow.performance) {
              throw new Error('Performance testing is not allowed in ' + process.env.TEST_ENV);
            }

            process.stdout.write(config.apiBaseUrl);
          ")

          echo "TARGET_BASE_URL=$TARGET_BASE_URL" >> "$GITHUB_ENV"

      - name: Run k6 workloads
        run: |
          shopt -s nullglob
          workloads=()
          for script in tests/performance/k6/*.js; do
            workloads+=("$script")
          done

          if [ ${#workloads[@]} -eq 0 ]; then
            echo "No k6 workloads in tests/performance/k6. Add one from the k6-workload golden template." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status=0
          for script in "${workloads[@]}"; do
            name=$(basename "$script" .js)
            mkdir -p "performance-results/k6/$name"

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e TARGET_BASE_URL="$TARGET_BASE_URL" \
              -e K6_WEB_DASHBOARD=true \
              -e K6_WEB_DASHBOARD_PORT=-1 \
              -e K6_WEB_DASHBOARD_EXPORT="/reports/$name.html" \
              -v "$PWD:/work:ro" \
              -v "$PWD/performance-results/k6/$name:/reports" \
              "$K6_IMAGE" \
              run "/work/$script" || status=1

            if [ -f "performance-results/k6/$name/github-summary.md" ]; then
              cat "performance-results/k6/$name/github-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          exit $status

      - name: Upload k6 reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-k6
          path: performance-results/k6/
          retention-days: 7
          if-no-files-found: ignore

  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEST_ENV: ${{ inputs.environment }}
      # @qa:secrets:start (managed by npm run qa:sync-ci-secrets)
      # @qa:secrets:end

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve browser-performance Chromium
        run: |
          CHROME_PATH=$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse audit
        run: |
          mkdir -p performance-results/lighthouse
          npx lhci autorun --config=framework/core/performance/lighthouse/lighthouseConfig.js

      - name: Run authenticated Lighthouse scenarios
        run: |
          if compgen -G "tests/performance/*.spec.ts" > /dev/null; then
            npx playwright test --project=performance
          else
            echo "No authenticated Lighthouse scenarios in tests/performance." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish Lighthouse summary
        if: always()
        run: |
          if [ -f performance-results/lighthouse/github-summary.md ]; then
            cat performance-results/lighthouse/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-lighthouse
          path: performance-results/lighthouse/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright performance report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-playwright
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
