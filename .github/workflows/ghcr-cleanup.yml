name: GHCR Cleanup

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PACKAGE_NAME: playwright-enterprise-tests
  RETENTION_DAYS: 7
  MIN_VERSIONS_TO_KEEP: 3

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete old GHCR package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d "${RETENTION_DAYS} days ago" +%s)

          versions=$(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq '.[] | [.id, .created_at] | @tsv' |
              sort -t $'\t' -k2,2r
          )

          if [ -z "$versions" ]; then
            echo "No GHCR package versions found."
            exit 0
          fi

          index=0

          while IFS=$'\t' read -r version_id created_at; do
            index=$((index + 1))

            if [ "$index" -le "$MIN_VERSIONS_TO_KEEP" ]; then
              echo "Keeping package version ${version_id}: protected as one of the newest ${MIN_VERSIONS_TO_KEEP}."
              continue
            fi

            created_epoch=$(date -u -d "$created_at" +%s)

            if [ "$created_epoch" -ge "$cutoff_epoch" ]; then
              echo "Keeping package version ${version_id}: younger than ${RETENTION_DAYS} days."
              continue
            fi

            echo "Deleting package version ${version_id}: older than ${RETENTION_DAYS} days."

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
          done <<< "$versions"
