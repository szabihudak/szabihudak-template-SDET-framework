name: Playwright CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_ENV: hosted
  TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/playwright-enterprise-tests:${{ github.sha }}

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

  build-image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker build -t "$TEST_IMAGE" .

      - name: Push Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "$TEST_IMAGE"

  api:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker pull "$TEST_IMAGE"

      - name: Build Playwright test image for fork PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: docker build -t "$TEST_IMAGE" .

      - name: Run API tests
        run: |
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            "$TEST_IMAGE" \
            npx playwright test --project=api

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

      - name: Upload API failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: test-results/
          retention-days: 7

  ui:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker pull "$TEST_IMAGE"

      - name: Build Playwright test image for fork PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: docker build -t "$TEST_IMAGE" .

      - name: Run UI tests
        run: |
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            "$TEST_IMAGE" \
            npx playwright test --project=${{ matrix.browser }}

      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  accessibility:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker pull "$TEST_IMAGE"

      - name: Build Playwright test image for fork PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: docker build -t "$TEST_IMAGE" .

      - name: Run Accessibility tests
        run: |
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            "$TEST_IMAGE" \
            npx playwright test --project=accessibility

      - name: Upload Accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-accessibility
          path: playwright-report/
          retention-days: 7

      - name: Upload Accessibility failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-accessibility
          path: test-results/
          retention-days: 7

  visual:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Playwright test image
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker pull "$TEST_IMAGE"

      - name: Build Playwright test image for fork PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: docker build -t "$TEST_IMAGE" .

      - name: Run Visual tests
        run: |
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            "$TEST_IMAGE" \
            npx playwright test --project=visual

      - name: Upload Visual report
        if: always()
