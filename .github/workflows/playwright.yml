name: Playwright CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/playwright-enterprise-tests:${{ github.sha }}
  UPEX_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/upex-local
  UPEX_REPOSITORY: https://github.com/upex-galaxy/upex-dojo.git
  UPEX_REF: staging

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

  build-images:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      upex_sha: ${{ steps.upex.outputs.sha }}
      upex_image: ${{ steps.upex.outputs.image }}

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Checkout UPEX target application
        run: |
          git clone \
            --depth 1 \
            --branch "$UPEX_REF" \
            "$UPEX_REPOSITORY" \
            ../upex-dojo

      - name: Resolve UPEX image identity
        id: upex
        run: |
          UPEX_SHA="$(git -C ../upex-dojo rev-parse HEAD)"
          UPEX_IMAGE="${UPEX_IMAGE_REPOSITORY}:${UPEX_SHA}"

          echo "sha=${UPEX_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${UPEX_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Playwright test image
        run: docker build -t "$TEST_IMAGE" .

      - name: Push Playwright test image
        run: docker push "$TEST_IMAGE"

      - name: Build UPEX application image
        run: |
          docker build \
            -f Dockerfile.upex-local \
            --build-context upex=../upex-dojo \
            -t "${{ steps.upex.outputs.image }}" \
            .

      - name: Push UPEX application image
        run: docker push "${{ steps.upex.outputs.image }}"

  functional:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - api
          - database
          - accessibility
          - visual

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPEX_IMAGE: ${{ needs.build-images.outputs.upex_image }}

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ephemeral NextAuth secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Pull immutable test images
        run: |
          docker pull "$TEST_IMAGE"
          docker pull "$UPEX_IMAGE"

      - name: Start UPEX application
        run: |
          docker compose \
            -f docker-compose.yml \
            up -d app

      - name: Run ${{ matrix.project }} tests
        run: |
          docker compose \
            -f docker-compose.yml \
            run --rm tests \
            npx playwright test --project=${{ matrix.project }}

      - name: Show UPEX logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            logs app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Stop test environment
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            down

  ui:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPEX_IMAGE: ${{ needs.build-images.outputs.upex_image }}

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ephemeral NextAuth secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Pull immutable test images
        run: |
          docker pull "$TEST_IMAGE"
          docker pull "$UPEX_IMAGE"

      - name: Start UPEX application
        run: |
          docker compose \
            -f docker-compose.yml \
            up -d app

      - name: Run ${{ matrix.browser }} tests
        run: |
          docker compose \
            -f docker-compose.yml \
            run --rm tests \
            npx playwright test --project=${{ matrix.browser }}

      - name: Show UPEX logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            logs app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Stop test environment
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            down
