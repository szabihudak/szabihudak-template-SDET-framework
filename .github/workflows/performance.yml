name: Performance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_ENV: hosted
  K6_IMAGE: grafana/k6:1.8.1

concurrency:
  group: performance-hosted
  cancel-in-progress: false

jobs:
  api-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target environment
        run: |
          TARGET_BASE_URL=$(node -e "
            const environments = require('./config/environments/environments.json');
            const environment = process.env.TEST_ENV;
            const config = environments[environment];

            if (!config) {
              throw new Error(\`Unknown TEST_ENV: \${environment}\`);
            }

            process.stdout.write(config.apiBaseUrl);
          ")

          echo "TARGET_BASE_URL=$TARGET_BASE_URL" >> "$GITHUB_ENV"

      - name: Create k6 results directory
        run: mkdir -p performance-results/k6

      - name: Run k6 API performance test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TARGET_BASE_URL="$TARGET_BASE_URL" \
            -e K6_WEB_DASHBOARD=true \
            -e K6_WEB_DASHBOARD_PORT=-1 \
            -e K6_WEB_DASHBOARD_EXPORT=/reports/task-read-load.html \
            -v "$PWD/performance/k6:/scripts" \
            -v "$PWD/performance-results/k6:/reports" \
            "$K6_IMAGE" \
            run /scripts/taskReadLoad.js

      - name: Upload k6 performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-k6-task-read
          path: performance-results/k6/task-read-load.html
          retention-days: 7
          if-no-files-found: error

  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create Lighthouse results directory
        run: mkdir -p performance-results/lighthouse

      - name: Run Lighthouse browser performance audit
        run: |
          npx lhci autorun \
            --config=performance/lighthouse/lighthouseConfig.js

      - name: Run authenticated dashboard Lighthouse audit
        run: |
          npx playwright test \
            tests/performance/lighthouse-dashboard.spec.ts \
            --project=performance

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-lighthouse
          path: performance-results/lighthouse/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-playwright
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
