name: Performance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_ENV: hosted
  K6_IMAGE: grafana/k6:1.8.1

concurrency:
  group: performance-hosted
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target environment
        run: |
          TARGET_BASE_URL=$(node -e "
            const environments = require('./config/environments/environments.json');
            const environment = process.env.TEST_ENV;
            const config = environments[environment];

            if (!config) {
              throw new Error(\`Unknown TEST_ENV: \${environment}\`);
            }

            process.stdout.write(config.apiBaseUrl);
          ")

          echo "TARGET_BASE_URL=$TARGET_BASE_URL" >> "$GITHUB_ENV"

      - name: Create performance results directory
        run: mkdir -p performance-results

      - name: Run k6 performance test
        run: |
          docker run --rm \
            -e TARGET_BASE_URL="$TARGET_BASE_URL" \
            -e K6_WEB_DASHBOARD=true \
            -e K6_WEB_DASHBOARD_PORT=-1 \
            -e K6_WEB_DASHBOARD_EXPORT=/reports/task-read-load.html \
            -v "$PWD/performance/k6:/scripts" \
            -v "$PWD/performance-results:/reports" \
            "$K6_IMAGE" \
            run /scripts/taskReadLoad.js

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-task-read
          path: performance-results/task-read-load.html
          retention-days: 7
          if-no-files-found: warn
