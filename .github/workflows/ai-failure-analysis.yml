name: AI Failure Analysis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID containing the failure evidence"
        required: true
        type: string
      artifact_name:
        description: "Failure diagnostics artifact name"
        required: true
        type: string
      model:
        description: "OpenAI model"
        required: true
        default: "gpt-5.6-luna"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ inputs.model }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Download failure diagnostics
        run: |
          gh run download "${{ inputs.run_id }}" \
            --name "${{ inputs.artifact_name }}" \
            --dir downloaded-artifact

      - name: Find failure evidence
        run: |
          find downloaded-artifact \
            -type f \
            -path "*/ai-failure-evidence/*.json" \
            | sort \
            > failure-evidence-files.txt

          if [ ! -s failure-evidence-files.txt ]; then
            echo "No AI failure evidence files found."
            exit 1
          fi

          echo "Failure evidence files:"
          cat failure-evidence-files.txt

      - name: Analyze failures
        run: |
          while IFS= read -r evidence_file; do
            npm run ai:analyze-failure -- "$evidence_file"
          done < failure-evidence-files.txt

      - name: Add analysis to job summary
        if: always()
        run: |
          if [ -d test-results/ai-failure-analysis ]; then
            for analysis_file in test-results/ai-failure-analysis/*.json; do
              [ -f "$analysis_file" ] || continue

              echo "## $(basename "$analysis_file")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$analysis_file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Upload AI failure analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis-${{ inputs.run_id }}
          path: test-results/ai-failure-analysis/
          if-no-files-found: ignore
          retention-days: 7
