services:
  app:
    image: ${UPEX_IMAGE:-upex-local:local}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: http://upex-local:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      default:
        aliases:
          - upex-local
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    image: ${TEST_IMAGE:-playwright-enterprise-tests:local}
    environment:
      TEST_ENV: localDocker
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
